name: aot-example-02-plain-jvm-aot-cache

x-java-image: &java-image eclipse-temurin:25-jdk-noble@sha256:589ff4cc3f71aab462e7048a47a0d10edf57fbccde3fceea2281e610bf5880b4

x-application: &application
  build:
    context: .
    dockerfile: containers/application.Dockerfile
    target: application
    args:
      JAVA_IMAGE: *java-image
      TRAIN_ITERATIONS: ${TRAIN_ITERATIONS:-100000}
  image: aot-examples/02-plain-jvm-aot-cache:local
  cpus: 1.0
  mem_limit: 512m
  init: true

services:
  cli-jvm-cache:
    <<: *application
    profiles: [cli-jvm-cache]

  cli-benchmark:
    <<: *application
    profiles: [benchmark]
    image: aot-examples/02-plain-jvm-aot-cache-benchmark:local
    environment:
      EXAMPLE_ID: 02-plain-jvm-aot-cache
    build:
      context: .
      dockerfile: containers/application.Dockerfile
      target: benchmark
      args:
        JAVA_IMAGE: *java-image
        TRAIN_ITERATIONS: ${TRAIN_ITERATIONS:-100000}
    volumes:
      - ../../results:/results
      - ../../benchmark:/benchmark:ro

  gradle:
    profiles: [tools]
    image: aot-examples/02-plain-jvm-aot-cache-gradle-tools:local
    build:
      context: .
      dockerfile: containers/gradle.Dockerfile
    working_dir: /workspace
    cpus: 2.0
    mem_limit: 1g
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: []

  jdk:
    profiles: [tools]
    image: *java-image
    entrypoint: []

volumes:
  gradle-cache:
