name: aot-example-01-plain-java

x-java-image: &java-image eclipse-temurin:25-jdk-noble@sha256:589ff4cc3f71aab462e7048a47a0d10edf57fbccde3fceea2281e610bf5880b4

x-application: &application
  build:
    context: .
    dockerfile: containers/application.Dockerfile
    target: application
    args:
      JAVA_IMAGE: *java-image
  image: aot-examples/01-plain-java:local
  cpus: 1.0
  mem_limit: 512m
  init: true

services:
  cli-baseline:
    <<: *application
    profiles: [cli-baseline]

  cli-benchmark:
    <<: *application
    profiles: [benchmark]
    image: aot-examples/01-plain-java-benchmark:local
    build:
      context: .
      dockerfile: containers/application.Dockerfile
      target: benchmark
      args:
        JAVA_IMAGE: *java-image
    volumes:
      - ../../results:/results
      - ../../benchmark:/benchmark:ro

  gradle:
    profiles: [tools]
    image: aot-examples/01-plain-java-gradle-tools:local
    build:
      context: .
      dockerfile: containers/gradle.Dockerfile
    working_dir: /workspace
    cpus: 2.0
    mem_limit: 1g
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    entrypoint: []

  jdk:
    profiles: [tools]
    image: *java-image
    entrypoint: []

volumes:
  gradle-cache:
