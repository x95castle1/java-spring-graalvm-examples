plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'org.graalvm.buildtools.native' version '1.1.8' apply false
}

group = 'dev.aotexamples'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
repositories { mavenCentral() }

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '256m'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
springBoot { mainClass = 'dev.aotexamples.spring.CatalogApplication' }
tasks.named('bootJar') { archiveFileName = 'catalog-service.jar' }
tasks.named('jar') { archiveClassifier = 'plain' }

// Keep independent plain and AOT outputs within this project.
def plainBuild = providers.gradleProperty('plain').map { it.toBoolean() }.getOrElse(false)
layout.buildDirectory = layout.projectDirectory.dir(plainBuild ? 'build/plain' : 'build/aot')
if (!plainBuild) {
    apply plugin: 'org.graalvm.buildtools.native'
    tasks.named('processAot') { maxHeapSize = '256m' }
    tasks.named('processTestAot') { maxHeapSize = '256m' }
    graalvmNative {
        toolchainDetection = false
        metadataRepository { enabled = true; version = '1.0.9' }
    binaries {
            main {
                imageName = 'catalog-service'
                fallback = false
                buildArgs.addAll('--gc=serial', '-march=compatibility',
                                 '--parallelism=2')
                jvmArgs.add('-Xmx4g')
            }
        }
    }
}
